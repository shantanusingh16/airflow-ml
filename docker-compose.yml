# Airflow 3 + MinIO (S3) + job-runner stack for ML pipelines.
#
# Quick start:
#   docker compose build                                # airflow image (providers baked in)
#   docker compose --profile build build jobrunner      # job-runner image (ml-jobrunner:latest)
#   docker compose up -d                                # boots postgres, redis, minio, airflow
#
#   UI:            http://localhost:8081   (user: airflow / airflow)
#   MinIO console: http://localhost:9001   (user: minioadmin / minioadmin)
#   MinIO S3 API:  http://localhost:9000

name: airflow-ml

x-airflow-common: &airflow-common
  # Built locally on top of apache/airflow:3.3.1 with pinned providers
  # (DockerOperator + S3/MinIO support). See Dockerfile.airflow.
  image: ${AIRFLOW_IMAGE_NAME:-airflow-ml:3.3.1}
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    &airflow-common-env
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "30"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__CORE__LOAD_EXAMPLES: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    # Fernet key for encrypting connection secrets / XCom (single source of truth
    # in .env; avoids per-container key races through the shared airflow.cfg)
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    # Shared JWT secret for all airflow components (task-log auth, API)
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY}
    # Host path of the airflow-ml project dir, passed into every airflow-*
    # container so job-task bind mounts (dags/, triton-models/)
    # resolve on the correct host. No default: an unset value must stay
    # visible (empty), not silently fall back to a host-specific path.
    AIRFLOW_PROJ_DIR: ${AIRFLOW_PROJ_DIR}
    # Loaded by `airflow-init`; see docker docs for `x-airflow-common`.
    _AIRFLOW_DB_MIGRATE: "true"
    _AIRFLOW_WWW_USER_CREATE: "true"
    _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
    _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    # S3 (MinIO) access for DAGs/hooks; secrets come from .env
    S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    S3_BUCKET: ${S3_BUCKET:-ml-artifacts}
    S3_REGION: ${S3_REGION:-us-east-1}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    # Job runner (DockerOperator) image + network
    JOB_RUNNER_IMAGE: ${JOB_RUNNER_IMAGE:-ml-jobrunner:latest}
    JOB_NETWORK: ${JOB_NETWORK:-airflow-ml-net}
    # ML platform services (consumed by DAGs / job containers)
    DEEPLAKE_DATASET: ${DEEPLAKE_DATASET:-s3://ml-artifacts/deeplake/feature_ds}
    EMBEDDING_TENSOR: ${EMBEDDING_TENSOR:-features}
    QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    QDRANT_COLLECTION: ${QDRANT_COLLECTION:-feature_vectors}
    QDRANT_DISTANCE: ${QDRANT_DISTANCE:-cosine}
    TRITON_HTTP_URL: ${TRITON_HTTP_URL:-http://triton:8005}
    TRITON_GRPC_URL: ${TRITON_GRPC_URL:-triton:8000}
    TRITON_MODEL_NAME: ${TRITON_MODEL_NAME:-linreg_onnx}
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    # voc12_demo: per-trigger param default + dataset mount source
    SAMPLE: ${SAMPLE:-1000}
    VOC_DATASET_HOST_DIR: ${VOC_DATASET_HOST_DIR:-/datasets/voc2012}
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
  user: "${AIRFLOW_UID:-1000}:${AIRFLOW_GID:-0}"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  # Host docker group (worker uses the docker socket; harmless elsewhere).
  group_add:
    - "${DOCKER_GROUP:-docker}"

services:
  # ---------------------------------------------------------------- database
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ml

  redis:
    image: redis:7.2-bookworm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      start_period: 30s
    networks:
      - ml

  # ------------------------------------------------------------- minio (S3)
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console (web UI)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ml

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/$${MINIO_BUCKET};
      echo 'bucket $${MINIO_BUCKET} ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-ml-artifacts}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - ml

  # -------------------------------------------------- airflow: one-shot init
  airflow-init:
    <<: *airflow-common
    command: bash -c true
    healthcheck:
      test: ["CMD-SHELL", "airflow db check"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: "no"
    depends_on:
      <<: *airflow-common-depends-on
    networks:
      - ml

  # Creates the S3 (MinIO) connection in the metadata DB.
  # Runs once after airflow-init; idempotent on re-run.
  airflow-conn-init:
    <<: *airflow-common
    command: >-
      bash -c "
      airflow connections delete $${S3_CONN_ID} 2>/dev/null;
      airflow connections add $${S3_CONN_ID} --conn-type aws --conn-login $${S3_ACCESS_KEY} --conn-password $${S3_SECRET_KEY} --conn-host minio:9000
      --conn-extra '{\"endpoint_url\": \"http://minio:9000\", \"region_name\": \"us-east-1\", \"config_kwargs\": {\"s3\": {\"addressing_style\": \"path\"}}}'
      "
    environment:
      <<: *airflow-common-env
      S3_CONN_ID: ${S3_CONN_ID:-aws_default}
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - ml

  # --------------------------------------------------------- airflow: core
  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "2405:8080"   # host 8080 is taken by another service (llama-swap)
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - ml

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - ml

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - ml

  # Celery worker. Needs the docker socket so DockerOperator tasks can
  # launch job-runner containers on the host daemon (shared network + image).
  airflow-worker:
    <<: *airflow-common
    command: celery worker
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
      - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # yamllint disable rule:line-length
      test: ["CMD-SHELL", 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - ml

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - ml

  # --------------------------------------------------- airflow: optional UI
  flower:
    <<: *airflow-common
    command: celery flower
    ports:
      - "5555:5555"
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - ml
    profiles: ["flower"]

  # ------------------------------------------------- mlflow (experiment log)
  mlflow:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
    image: airflow-ml-mlflow:3.15.1-s3
    # Host headers the MLflow server accepts (DNS-rebinding protection) come
    # from MLFLOW_ALLOWED_HOSTS; unset/empty falls back to the default in the
    # --allowed-hosts line below (pinned list + any port on
    # localhost/127.0.0.1). Never set a bare `*` — it allows all hosts and
    # disables the protection.
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --artifacts-destination s3://${MINIO_BUCKET:-ml-artifacts}/mlflow
      --allowed-hosts ${MLFLOW_ALLOWED_HOSTS:-mlflow:5000,localhost:5000,127.0.0.1:5000,localhost,127.0.0.1,localhost:*,127.0.0.1:*}
    environment:
      # MLflow 3.x S3 artifact store uses standard AWS_* env vars for
      # credentials/region/endpoint (legacy MLFLOW_S3_ACCESS_KEY_ID etc. are
      # no longer read); MLFLOW_S3_ENDPOINT_URL is still honoured for the endpoint.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_REGION: ${S3_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${S3_ENDPOINT:-http://minio:9000}
      MLFLOW_S3_ENDPOINT_URL: ${S3_ENDPOINT:-http://minio:9000}
    ports:
      - "5000:5000"   # MLflow UI + REST API (artifact proxy is on by default)
    volumes:
      - mlflow-data:/mlflow
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ml

  # ------------------------------------------------------ qdrant (vectors)
  qdrant:
    image: qdrant/qdrant:v1.16.2
    ports:
      - "6333:6333"   # HTTP API (REST)
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - ml

  # ------------------------------------------------- triton (inference, CPU)
  triton:
    # -py3 (full) variant: includes the onnxruntime backend (the -pyt-python-py3
    # variant only ships pytorch + python backends and cannot serve ONNX models)
    image: nvcr.io/nvidia/tritonserver:26.07-py3
    command:
      - tritonserver
      - --model-repository=/models
      - --model-control=explicit
      - --grpc-port=8000
      - --http-port=8005
      - --metrics-port=8006
    ports:
      - "8000:8000"   # gRPC inference (tritonclient)
      - "8005:8005"   # HTTP inference / model-control API
      - "8006:8006"   # Prometheus metrics
    volumes:
      # Same host dir is bind-mounted into job containers (see dags/jobtask.py)
      - ${AIRFLOW_PROJ_DIR:-.}/triton-models:/models
    restart: unless-stopped
    networks:
      - ml

  # -------------------------------------------------------- airflow: shell
  airflow-cli:
    <<: *airflow-common
    profiles: ["debug"]
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command: -c true
    # `docker compose --profile debug run --rm airflow-cli airflow dags list`
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
      - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - ml

  # ------------------------------------------------ job-runner image build
  # Builds the custom job-runner image (custom Python ML jobs) into the host
  # daemon so airflow-worker can launch it via DockerOperator.
  #   docker compose --profile build build jobrunner
  jobrunner:
    profiles: ["build"]
    image: ${JOB_RUNNER_IMAGE:-ml-jobrunner:latest}
    build:
      context: ./jobrunner
    restart: "no"
    networks:
      - ml

networks:
  ml:
    name: ${JOB_NETWORK:-airflow-ml-net}
    driver: bridge

volumes:
  postgres-db-volume:
  minio-data:
  mlflow-data:
  qdrant-storage: