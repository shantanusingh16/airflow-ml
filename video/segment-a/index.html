<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>segment-a · voc12_demo UX demo (ACQUIRE)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
    </style>
  </head>
  <body>
    <!--
      Segment A (ACQUIRE) of the voc12_demo UX demo.
      Base footage: assets/segment-a.mp4 — QA-approved capture, 1920x1080@30, 24.967 s, untouched
      (no re-render / speed / crop). Silent: no audio element; assembly mixes VO+music later.
      Shot layout: A1 0–9 s (Dags list → Details), A3 9–15 s (grid view), A2 15–25 s
      (upload log 15–20 s, MinIO console 20–25 s).
      Overlay values: observed.json (project root) is the source of truth; the only number
      literals introduced by overlays are the conf literal {"SAMPLE": 1000} (A1 caption,
      also on-screen UI text) and jpeg_uploaded = 1000 (A2 caption line 2).
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="24.967"
      data-width="1920"
      data-height="1080"
      style="background: #000"
    >
      <video
        id="base-clip"
        class="clip"
        data-start="0"
        data-duration="24.967"
        data-track-index="0"
        muted
        playsinline
        src="assets/segment-a.mp4"
        style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1"
      ></video>

      <!-- Caption bar, always on, bottom of frame (one host, captions track) -->
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="24.967"
        data-track-index="1"
        data-track-kind="captions"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>

      <!-- Per-shot overlays: title chip + callout boxes (graphics tracks) -->
      <div
        id="a1"
        data-composition-id="a1"
        data-composition-src="compositions/a1.html"
        data-start="0"
        data-duration="9"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>
      <div
        id="a3"
        data-composition-id="a3"
        data-composition-src="compositions/a3.html"
        data-start="9"
        data-duration="6"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 4"
      ></div>
      <div
        id="a2"
        data-composition-id="a2"
        data-composition-src="compositions/a2.html"
        data-start="15"
        data-duration="5"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 5"
      ></div>
      <div
        id="a2x"
        data-composition-id="a2x"
        data-composition-src="compositions/a2x.html"
        data-start="15"
        data-duration="9.967"
        data-track-index="5"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 6"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
