# Deployment definition (operator-owned, like routing.yaml). Read by factory-staging (Phase 5),
# later by factory-prod. The compose file itself comes from the deployed commit and is
# policy-checked as root before anything runs.
compose: docker-compose.yml
profiles: []                         # compose profiles to include (mirror prod: default services)
mkdir: [config, triton-models]       # gitignored/untracked dirs the stack bind-mounts
images:                              # images DAGs launch via DockerOperator (not compose services)
  - tag: ml-jobrunner:latest
    context: jobrunner
  - tag: ml-jobrunner-gpu:latest
    context: jobrunner
    file: jobrunner/Dockerfile.gpu
container_socket: [airflow-worker]   # gets this environment's Docker API shim as /var/run/docker.sock
#service_env:                         # container env the compose file does not pass (app card: pass AIRFLOW_PROJ_DIR)
#  "*": {AIRFLOW_PROJ_DIR: "{src}"}   # jobtask.py otherwise falls back to the operator's real project path
env:
  AIRFLOW_PROJ_DIR: "{src}"          # host path the worker hands to DockerOperator mounts
  VOC_DATASET_HOST_DIR: /run/media/shantanu/Volume/Datasets/voc2012/test   # job-container bind source (host path)
  AIRFLOW_UID: "50000"
  AIRFLOW_GID: "0"
  DOCKER_GROUP: "0"                  # socket is root-group inside the rootless user namespace
  _AIRFLOW_WWW_USER_USERNAME: airflow
  MINIO_ROOT_USER: minioadmin
  MINIO_BUCKET: ml-artifacts
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_CONN_ID: aws_default
generate:                            # per environment; removed on `down` unless --keep-data
  _AIRFLOW_WWW_USER_PASSWORD: password
  MINIO_ROOT_PASSWORD: password
  AIRFLOW__CORE__FERNET_KEY: fernet
  AIRFLOW__API__SECRET_KEY: hex32
  AIRFLOW__API_AUTH__JWT_SECRET: hex32
alias:
  S3_ACCESS_KEY: MINIO_ROOT_USER
  S3_SECRET_KEY: MINIO_ROOT_PASSWORD
ui:                                  # published on 127.0.0.1 random ports only
  airflow:
    service: airflow-apiserver
    port: 8080
    health: /api/v2/monitor/health
    login: {user: _AIRFLOW_WWW_USER_USERNAME, password: _AIRFLOW_WWW_USER_PASSWORD}
  minio-console:
    service: minio
    port: 9001
    login: {user: MINIO_ROOT_USER, password: MINIO_ROOT_PASSWORD}
  mlflow:
    service: mlflow
    port: 5000
datasets:
  coco: {services: [airflow-worker], target: /datasets/coco}
  voc2012: {services: [airflow-worker], target: /datasets/voc2012}
gpu: {vram_gb: 8}                    # peak VRAM: staging warns below it, prod refuses
staging:
  ttl_hours: 4
  ready_timeout_s: 1500
environments:
  prod:                              # factory-env prod (operator-only); staging ignores this block
    ports:                           # fixed host ports; loopback until you choose otherwise
      airflow: "127.0.0.1:12405"     # your current Docker instance keeps :2405 until you cut over
      minio-console: "127.0.0.1:19001"
      mlflow: "127.0.0.1:15000"
